name: CI

# Every push and PR: gofmt, vet and the tests, in the same image the
# Makefile uses.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Format, vet and test
        run: |
          docker run --rm -v "$PWD":/w -w /w/src -e CGO_ENABLED=0 -e GOFLAGS=-buildvcs=false golang:1.25 \
            sh -c 'test -z "$(gofmt -l .)" && go vet ./... && go test ./...'
